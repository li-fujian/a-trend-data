name: Scheduled Data Fetch

on:
  workflow_dispatch:
  schedule:
    # Beijing time Mon-Fri 15:30 == UTC 07:30
    - cron: '30 7 * * 1-5'

permissions:
  contents: write

concurrency:
  group: data-fetch-master
  cancel-in-progress: false

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout data repo (master)
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Setup JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Compile and run updater
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd java
          mvn -q -DskipTests compile
          mvn -q exec:java -Dexec.mainClass=DataUpdateCli "-Dexec.args=--repo-root $GITHUB_WORKSPACE"
